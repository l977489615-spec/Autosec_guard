name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt pytest pytest-cov pip-audit

      - name: Python dependency audit
        run: pip-audit -r server/requirements.txt

      - name: Python syntax check
        run: |
          python -m py_compile \
            server/server.py \
            server/agent_orchestrator.py \
            server/sandbox_runner.py \
            server/poc_worker.py \
            server/benchmark_suite.py \
            server/run_benchmark_suite.py \
            server/generate_benchmark_suite.py \
            server/validate_benchmark_suite.py \
            server/pocs/*.py \
            server/pocs/**/*.py

      - name: Backend contract tests
        run: python -m unittest discover -s server -p 'test_*.py' -q

      - name: Complete 317 PoC contract gate
        run: python server/validate_poc_contracts.py --expected-count 317

      - name: Runtime architecture boundary gate
        run: python server/architecture_audit.py

      - name: Benchmark suite freshness check
        working-directory: server
        run: python generate_benchmark_suite.py --check

      - name: Benchmark suite schema validation
        working-directory: server
        run: |
          python validate_benchmark_suite.py --suite-file benchmarks/default_suite.json
          python validate_benchmark_suite.py --suite-file benchmarks/regression_suite.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: TypeScript check
        working-directory: client
        run: npm run typecheck

      - name: Frontend unit tests
        working-directory: client
        run: npm test

      - name: Frontend dependency audit
        working-directory: client
        run: npm audit --audit-level=high

      - name: Offline frontend build
        working-directory: client
        run: |
          npm run build
          ! grep -R "cdn.tailwindcss.com\|https://unpkg.com" dist

      - name: Benchmark full fixture suite
        working-directory: server
        run: python run_benchmark_suite.py --fixture-dir benchmarks/fixtures --suite-file benchmarks/default_suite.json --min-pass-rate 1.0 --strict

      - name: Benchmark regression gate
        working-directory: server
        run: python run_benchmark_suite.py --fixture-dir benchmarks/fixtures --suite-file benchmarks/regression_suite.json --min-pass-rate 1.0 --strict
