name: Edge Workstation Release

on:
  workflow_dispatch:
    inputs:
      backend:
        description: "Packaging backend. Nuitka builds a compiled standalone package in CI to avoid onefile timeouts."
        required: true
        default: "pyinstaller"
        type: choice
        options:
          - pyinstaller
          - nuitka
      upload_release:
        description: "Also upload artifacts to a GitHub Release. Only works on tag refs."
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"
      - "edge-workstation-v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            release_zip: build/edge_workstation/release/autosec-guard-edge-linux-x64.zip
            release_dir: build/edge_workstation/release/autosec-guard-edge-linux-x64
            executable: build/edge_workstation/release/autosec-guard-edge-linux-x64/autosec-guard-edge
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            release_zip: build/edge_workstation/release/autosec-guard-edge-linux-arm64.zip
            release_dir: build/edge_workstation/release/autosec-guard-edge-linux-arm64
            executable: build/edge_workstation/release/autosec-guard-edge-linux-arm64/autosec-guard-edge
          - target: windows-x64
            runner: windows-latest
            release_zip: build/edge_workstation/release/autosec-guard-edge-windows-x64.zip
            release_dir: build/edge_workstation/release/autosec-guard-edge-windows-x64
            executable: build/edge_workstation/release/autosec-guard-edge-windows-x64/autosec-guard-edge.exe
          - target: macos-arm64
            runner: macos-14
            release_zip: build/edge_workstation/release/autosec-guard-edge-macos-arm64.zip
            release_dir: build/edge_workstation/release/autosec-guard-edge-macos-arm64
            executable: build/edge_workstation/release/autosec-guard-edge-macos-arm64/autosec-guard-edge

    steps:
      - name: Checkout private source
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Python packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
          python -m pip install pyinstaller nuitka ordered-set zstandard

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build edge workstation package
        shell: bash
        env:
          AUTOSEC_PYINSTALLER_MODE: onedir
          AUTOSEC_NUITKA_MODE: standalone
          AUTOSEC_NUITKA_JOBS: "1"
        run: python packaging/build_edge_workstation.py --backend "${{ github.event.inputs.backend || 'pyinstaller' }}"

      - name: Verify release files
        shell: bash
        run: |
          test -f "${{ matrix.release_zip }}"
          test -d "${{ matrix.release_dir }}"
          test -f "${{ matrix.executable }}"

      - name: Smoke test packaged workstation
        shell: bash
        env:
          AUTOSEC_RELEASE_EXE: ${{ matrix.executable }}
          AUTOSEC_TEST_DATA_DIR: ${{ runner.temp }}/autosec-guard-edge-data
          AUTOSEC_TEST_PORT: "5017"
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          import http.cookiejar
          import urllib.request

          exe = os.path.abspath(os.path.normpath(os.environ["AUTOSEC_RELEASE_EXE"]))
          exe_dir = os.path.dirname(exe) or "."
          port = os.environ["AUTOSEC_TEST_PORT"]
          env = os.environ.copy()
          env["AUTOSEC_DATA_DIR"] = os.path.normpath(os.environ["AUTOSEC_TEST_DATA_DIR"])
          env["AUTOSEC_PORT"] = port
          env["AUTOSEC_HOST"] = "127.0.0.1"
          env["PYTHONUNBUFFERED"] = "1"

          proc = subprocess.Popen(
              [exe],
              cwd=exe_dir,
              env=env,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1,
          )
          result = {"ok": False, "health": None, "poc_total": None, "home_status": None, "last_error": ""}
          output_lines = []
          try:
              deadline = time.time() + 90
              while time.time() < deadline:
                  if proc.poll() is not None:
                      if proc.stdout:
                          output_lines.extend(proc.stdout.read().splitlines())
                      raise RuntimeError(
                          f"packaged workstation exited early with code {proc.returncode}; "
                          f"startup output:\n" + "\n".join(output_lines[-120:])
                      )

                  try:
                      with urllib.request.urlopen(f"http://127.0.0.1:{port}/health", timeout=2) as response:
                          result["health"] = json.loads(response.read().decode("utf-8"))
                          result["ok"] = True
                          break
                  except Exception as exc:
                      result["last_error"] = str(exc)
                      time.sleep(1)

              if not result["ok"]:
                  raise RuntimeError(
                      f"health check failed after 90s: {result['last_error']}; "
                      f"process still running={proc.poll() is None}"
                  )

              cookie_jar = http.cookiejar.CookieJar()
              opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookie_jar))
              def post_json(path, payload):
                  request = urllib.request.Request(
                      f"http://127.0.0.1:{port}{path}",
                      data=json.dumps(payload).encode("utf-8"),
                      headers={
                          "Content-Type": "application/json",
                          "Origin": f"http://127.0.0.1:{port}",
                      },
                      method="POST",
                  )
                  return opener.open(request, timeout=10)

              with post_json("/api/v1/auth/register", {
                  "username": "release-admin",
                  "password": "release-smoke-password-3.0",
              }):
                  pass
              with post_json("/api/v1/auth/login", {
                  "username": "release-admin",
                  "password": "release-smoke-password-3.0",
              }):
                  pass

              with opener.open(f"http://127.0.0.1:{port}/api/v1/list_pocs", timeout=10) as response:
                  pocs = json.loads(response.read().decode("utf-8"))
                  result["poc_total"] = pocs.get("total")
                  if int(result["poc_total"] or 0) <= 0:
                      raise RuntimeError("packaged PoC registry is empty")

              with opener.open(f"http://127.0.0.1:{port}/api/v1/local/capabilities", timeout=10) as response:
                  capabilities = json.loads(response.read().decode("utf-8"))
                  if "capabilities" not in capabilities:
                      raise RuntimeError("local capability inventory is unavailable")

              with post_json("/api/v1/sessions", {
                  "mode": "manual",
                  "target": {"name": "release-smoke", "ip": "127.0.0.1"},
                  "policy": {"max_tier": "PASSIVE"},
              }) as response:
                  session_id = json.loads(response.read().decode("utf-8"))["session"]["id"]
              with post_json(f"/api/v1/sessions/{session_id}/runs", {}):
                  pass
              with post_json(f"/api/v1/sessions/{session_id}/runs", {
                  "action": "complete",
                  "result": {"confirmed_findings": 0, "smoke_test": True},
              }) as response:
                  completed = json.loads(response.read().decode("utf-8"))["session"]
                  if completed.get("status") != "completed":
                      raise RuntimeError("durable session did not reach completed state")

              with post_json("/api/v1/report/structured", {
                  "session": {
                      "id": session_id,
                      "targetName": "release-smoke",
                      "connection": {"ip": "127.0.0.1"},
                      "results": [],
                  }
              }) as response:
                  report = json.loads(response.read().decode("utf-8"))
                  if not report:
                      raise RuntimeError("structured report export returned no content")

              with urllib.request.urlopen(f"http://127.0.0.1:{port}/", timeout=10) as response:
                  result["home_status"] = response.status
                  if response.status != 200:
                      raise RuntimeError(f"frontend returned {response.status}")
          finally:
              proc.terminate()
              try:
                  proc.wait(timeout=10)
              except Exception:
                  proc.kill()

          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Upload workstation package
        uses: actions/upload-artifact@v7
        with:
          name: autosec-guard-edge-${{ matrix.target }}
          path: ${{ matrix.release_zip }}
          if-no-files-found: error

  release:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.upload_release) }}

    steps:
      - name: Download workstation packages
        uses: actions/download-artifact@v7
        with:
          pattern: autosec-guard-edge-*
          path: edge-workstation-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" edge-workstation-artifacts/*.zip --clobber
          else
            gh release create "$TAG_NAME" edge-workstation-artifacts/*.zip \
              --title "AutoSec Guard Edge Workstation $TAG_NAME" \
              --notes "Packaged edge-side workstation builds for Linux, Windows, and macOS. Source code and PoC source directories are not included in these artifacts."
          fi
