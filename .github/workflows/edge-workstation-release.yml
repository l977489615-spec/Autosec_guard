name: Edge Workstation Release

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Also upload artifacts to a GitHub Release. Only works on tag refs."
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"
      - "edge-workstation-v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-gate:
    name: Security release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Audit Python dependencies and source
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1 bandit==1.9.4
          python -m pip_audit -r server/requirements.txt --progress-spinner off
          python -m bandit -r server packaging -lll -x server/pocs,server/migrations
          # PoCs deliberately invoke local diagnostic/exploit binaries after
          # admin approval. Scan them for every HIGH issue except the expected
          # shell-execution rule; the custom gate below rejects client command injection.
          python -m bandit -r server/pocs -lll -x server/pocs/.venv -s B602
          python packaging/security_release_gate.py

      - name: Audit and test frontend
        working-directory: client
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm test

      - name: Run backend security contracts
        env:
          PYTHONPATH: server
        run: |
          python -m pip install --disable-pip-version-check -r server/requirements.txt
          python -m unittest discover -s server -p 'test_*.py' -v

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: security-gate
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            release_zip: build/edge_workstation/release/autosec-guard-edge-linux-x64.zip
            release_dir: build/edge_workstation/release/autosec-guard-edge-linux-x64
            executable: build/edge_workstation/release/autosec-guard-edge-linux-x64/autosec-guard-edge
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            release_zip: build/edge_workstation/release/autosec-guard-edge-linux-arm64.zip
            release_dir: build/edge_workstation/release/autosec-guard-edge-linux-arm64
            executable: build/edge_workstation/release/autosec-guard-edge-linux-arm64/autosec-guard-edge
          - target: windows-x64
            runner: windows-latest
            release_zip: build/edge_workstation/release/autosec-guard-edge-windows-x64.zip
            release_dir: build/edge_workstation/release/autosec-guard-edge-windows-x64
            executable: build/edge_workstation/release/autosec-guard-edge-windows-x64/autosec-guard-edge.exe
          - target: macos-arm64
            runner: macos-14
            release_zip: build/edge_workstation/release/autosec-guard-edge-macos-arm64.zip
            release_dir: build/edge_workstation/release/autosec-guard-edge-macos-arm64
            executable: build/edge_workstation/release/autosec-guard-edge-macos-arm64/autosec-guard-edge

    steps:
      - name: Checkout private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Python packaging dependencies
        run: |
          python -m pip install -r server/requirements.txt
          python -m pip install nuitka==4.0.7 ordered-set==4.1.0 zstandard==0.25.0

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build edge workstation package
        shell: bash
        env:
          AUTOSEC_NUITKA_MODE: onefile
          AUTOSEC_NUITKA_JOBS: "1"
        run: python packaging/build_edge_workstation.py --backend nuitka

      - name: Verify release files
        shell: bash
        run: |
          test -f "${{ matrix.release_zip }}"
          test -f "${{ matrix.release_zip }}.sha256"
          test -d "${{ matrix.release_dir }}"
          test -f "${{ matrix.executable }}"

      - name: Smoke test packaged workstation
        shell: bash
        env:
          AUTOSEC_RELEASE_EXE: ${{ matrix.executable }}
          AUTOSEC_TEST_DATA_DIR: ${{ runner.temp }}/autosec-guard-edge-data
          AUTOSEC_TEST_PORT: "5017"
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          import http.cookiejar
          import urllib.error
          import urllib.request

          exe = os.path.abspath(os.path.normpath(os.environ["AUTOSEC_RELEASE_EXE"]))
          exe_dir = os.path.dirname(exe) or "."
          port = os.environ["AUTOSEC_TEST_PORT"]
          env = os.environ.copy()
          env["AUTOSEC_DATA_DIR"] = os.path.normpath(os.environ["AUTOSEC_TEST_DATA_DIR"])
          env["AUTOSEC_PORT"] = port
          env["AUTOSEC_HOST"] = "127.0.0.1"
          env["PYTHONUNBUFFERED"] = "1"

          proc = subprocess.Popen(
              [exe],
              cwd=exe_dir,
              env=env,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1,
          )
          result = {"ok": False, "health": None, "poc_total": None, "home_status": None, "last_error": ""}
          output_lines = []
          try:
              deadline = time.time() + 90
              while time.time() < deadline:
                  if proc.poll() is not None:
                      if proc.stdout:
                          output_lines.extend(proc.stdout.read().splitlines())
                      raise RuntimeError(
                          f"packaged workstation exited early with code {proc.returncode}; "
                          f"startup output:\n" + "\n".join(output_lines[-120:])
                      )

                  try:
                      with urllib.request.urlopen(f"http://127.0.0.1:{port}/health", timeout=2) as response:
                          result["health"] = json.loads(response.read().decode("utf-8"))
                          result["ok"] = True
                          break
                  except Exception as exc:
                      result["last_error"] = str(exc)
                      time.sleep(1)

              if not result["ok"]:
                  raise RuntimeError(
                      f"health check failed after 90s: {result['last_error']}; "
                      f"process still running={proc.poll() is None}"
                  )

              cookie_jar = http.cookiejar.CookieJar()
              opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookie_jar))
              def post_json(path, payload):
                  request = urllib.request.Request(
                      f"http://127.0.0.1:{port}{path}",
                      data=json.dumps(payload).encode("utf-8"),
                      headers={
                          "Content-Type": "application/json",
                          "Origin": f"http://127.0.0.1:{port}",
                      },
                      method="POST",
                  )
                  return opener.open(request, timeout=10)

              with post_json("/api/v1/auth/register", {
                  "username": "release-admin",
                  "password": "release-smoke-password-3.0",
              }):
                  pass
              with post_json("/api/v1/auth/login", {
                  "username": "release-admin",
                  "password": "release-smoke-password-3.0",
              }):
                  pass

              with opener.open(f"http://127.0.0.1:{port}/api/v1/list_pocs", timeout=10) as response:
                  pocs = json.loads(response.read().decode("utf-8"))
                  result["poc_total"] = pocs.get("total")
                  if int(result["poc_total"] or 0) <= 0:
                      raise RuntimeError("packaged PoC registry is empty")

              with opener.open(f"http://127.0.0.1:{port}/api/v1/local/capabilities", timeout=10) as response:
                  capabilities = json.loads(response.read().decode("utf-8"))
                  if "capabilities" not in capabilities:
                      raise RuntimeError("local capability inventory is unavailable")

              with opener.open(f"http://127.0.0.1:{port}/api/v1/license/status", timeout=10) as response:
                  license_status = json.loads(response.read().decode("utf-8"))
                  if license_status.get("state") != "missing" or not license_status.get("machine_code"):
                      raise RuntimeError(f"unexpected initial license state: {license_status}")

              try:
                  post_json("/api/v1/sessions", {
                      "mode": "manual",
                      "target": {"name": "release-smoke", "ip": "127.0.0.1"},
                      "policy": {"max_tier": "PASSIVE"},
                  })
                  raise RuntimeError("unlicensed package unexpectedly allowed session creation")
              except urllib.error.HTTPError as exc:
                  denied = json.loads(exc.read().decode("utf-8"))
                  if exc.code != 403 or denied.get("error", {}).get("code") != "LICENSE_REQUIRED":
                      raise RuntimeError(f"unexpected unlicensed denial: HTTP {exc.code}: {denied}")

              with urllib.request.urlopen(f"http://127.0.0.1:{port}/", timeout=10) as response:
                  result["home_status"] = response.status
                  if response.status != 200:
                      raise RuntimeError(f"frontend returned {response.status}")
          finally:
              proc.terminate()
              try:
                  proc.wait(timeout=10)
              except Exception:
                  proc.kill()

          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Upload workstation package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: autosec-guard-edge-${{ matrix.target }}
          path: |
            ${{ matrix.release_zip }}
            ${{ matrix.release_zip }}.sha256
          if-no-files-found: error

      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ matrix.release_zip }}

  release:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.upload_release) }}
    permissions:
      contents: write

    steps:
      - name: Download workstation packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: autosec-guard-edge-*
          path: edge-workstation-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" edge-workstation-artifacts/*.zip edge-workstation-artifacts/*.sha256 --clobber
          else
            gh release create "$TAG_NAME" edge-workstation-artifacts/*.zip edge-workstation-artifacts/*.sha256 \
              --title "AutoSec Guard Edge Workstation $TAG_NAME" \
              --notes "Packaged edge-side workstation builds for Linux, Windows, and macOS. Source code and PoC source directories are not included in these artifacts."
          fi
