# ─────────────────────────────────────────────────────────────────────────────
# AutoSec Guard – Nginx TLS 反向代理参考配置
# 适用场景：在网络部署场景下，通过 Nginx 提供 HTTPS 并将请求转发到后端 Flask。
#
# 使用步骤：
#   1. 将此文件复制到 /etc/nginx/sites-available/autosec-guard
#   2. 替换 YOUR_DOMAIN 和证书路径
#   3. ln -s /etc/nginx/sites-available/autosec-guard /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#
# 证书获取（免费）：
#   certbot --nginx -d YOUR_DOMAIN
#   或手动：certbot certonly --standalone -d YOUR_DOMAIN
# ─────────────────────────────────────────────────────────────────────────────

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # ── TLS 证书 ──────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # ── TLS 安全参数 ──────────────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── 安全响应头 ────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           DENY                                            always;
    add_header X-Content-Type-Options    nosniff                                         always;
    add_header Referrer-Policy           "no-referrer-when-downgrade"                   always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://YOUR_DOMAIN" always;

    # ── 前端静态文件（React 构建产物） ───────────────────────
    root /opt/autosec-guard/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 后端 API 反向代理 ─────────────────────────────────────
    location /api/v1/ {
        proxy_pass         http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;      # PoC 执行可能较慢
        proxy_send_timeout 60s;
        proxy_buffering    off;       # SSE 流式推送需关闭缓冲
    }

    # ── SSE 流端点专属配置 ────────────────────────────────────
    location /api/v1/run_poc_stream {
        proxy_pass             http://127.0.0.1:5002;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_set_header       Connection        '';
        proxy_read_timeout     600s;
        proxy_send_timeout     60s;
        proxy_buffering        off;
        proxy_cache            off;
        chunked_transfer_encoding on;
    }

    # ── 请求体大小限制 ────────────────────────────────────────
    client_max_body_size 10m;

    # ── 访问日志 ──────────────────────────────────────────────
    access_log /var/log/nginx/autosec-guard.access.log;
    error_log  /var/log/nginx/autosec-guard.error.log  warn;
}
